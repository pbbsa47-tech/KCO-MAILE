<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempNexus · Admin Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #141a2b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }

        .admin-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(22, 28, 46, 0.85);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 48px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .admin-header .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .admin-header .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, #1a264b, #2b3d6e);
            padding: 4px;
            box-shadow: 0 8px 20px rgba(40, 80, 200, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-header .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #d6e2ff, #a5c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header h1 i {
            color: #5f84ff;
            font-size: 1.8rem;
        }

        .admin-header .status-badge {
            background: rgba(43, 158, 94, 0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            border: 1px solid rgba(63, 199, 122, 0.2);
            color: #3fc77a;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-header .status-badge i {
            color: #3fc77a;
        }

        /* Login Section */
        .login-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            gap: 2rem;
        }

        .login-section h2 {
            color: #d6e2ff;
            font-size: 2rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-section h2 i {
            color: #5f84ff;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 380px;
        }

        .login-form input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #2a3a66;
            border-radius: 40px;
            padding: 0.9rem 1.4rem;
            color: #d3defa;
            font-size: 0.95rem;
            outline: none;
            transition: 0.15s;
        }

        .login-form input:focus {
            border-color: #5f84ff;
            box-shadow: 0 0 0 3px rgba(70, 130, 255, 0.15);
        }

        .login-form .btn {
            width: 100%;
            justify-content: center;
            padding: 0.9rem;
        }

        .login-error {
            color: #faaab5;
            background: rgba(220, 60, 80, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #b44b5a;
            font-size: 0.9rem;
            display: none;
            text-align: center;
        }

        /* Dashboard */
        .dashboard {
            display: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(12, 17, 29, 0.6);
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            transition: 0.15s;
        }

        .stat-card:hover {
            border-color: rgba(95, 132, 255, 0.2);
            transform: translateY(-2px);
        }

        .stat-card .label {
            color: #7f97d0;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-card .label i {
            color: #5f84ff;
        }

        .stat-card .value {
            color: #d6e2ff;
            font-size: 2.2rem;
            font-weight: 600;
            margin-top: 8px;
        }

        .stat-card .change {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #6a80b3;
        }

        .stat-card .change.positive {
            color: #3fc77a;
        }

        .stat-card .change.negative {
            color: #faaab5;
        }

        .table-container {
            background: rgba(12, 17, 29, 0.4);
            border-radius: 24px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .table-header h3 {
            color: #d6e2ff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-header h3 i {
            color: #5f84ff;
        }

        .table-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .table-controls input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2a3a66;
            border-radius: 30px;
            padding: 0.5rem 1rem;
            color: #d3defa;
            font-size: 0.85rem;
            outline: none;
            min-width: 180px;
        }

        .table-controls input:focus {
            border-color: #5f84ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: #d3defa;
        }

        th {
            text-align: left;
            padding: 0.8rem 0.6rem;
            color: #7f97d0;
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            padding: 0.8rem 0.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 0.9rem;
        }

        tr:hover td {
            background: rgba(26, 38, 75, 0.3);
        }

        .status-badge {
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-badge.active {
            background: rgba(43, 158, 94, 0.25);
            color: #3fc77a;
            border: 1px solid rgba(63, 199, 122, 0.2);
        }

        .status-badge.banned {
            background: rgba(220, 60, 80, 0.2);
            color: #faaab5;
            border: 1px solid rgba(220, 60, 80, 0.2);
        }

        .btn {
            background: transparent;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 40px;
            font-weight: 550;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            cursor: pointer;
            color: #d3defa;
            border: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(30, 40, 70, 0.4);
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: linear-gradient(145deg, #3f6eff, #2b4ed3);
            border: 1px solid #5f84ff;
            color: white;
            box-shadow: 0 8px 18px -6px #1f3a9e;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            background: linear-gradient(145deg, #5a7eff, #3b5ee0);
        }

        .btn-danger {
            background: rgba(220, 60, 80, 0.15);
            border: 1px solid #b44b5a;
            color: #faaab5;
        }

        .btn-danger:hover {
            background: #832f3f;
            color: white;
        }

        .btn-success {
            background: rgba(43, 158, 94, 0.2);
            border: 1px solid rgba(63, 199, 122, 0.2);
            color: #3fc77a;
        }

        .btn-success:hover {
            background: #1e7a47;
            color: white;
        }

        .btn-sm {
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-sm.ban {
            background: rgba(220, 60, 80, 0.2);
            color: #faaab5;
            border: 1px solid rgba(220, 60, 80, 0.2);
        }

        .btn-sm.ban:hover {
            background: #832f3f;
            color: white;
        }

        .btn-sm.unban {
            background: rgba(43, 158, 94, 0.2);
            color: #3fc77a;
            border: 1px solid rgba(63, 199, 122, 0.2);
        }

        .btn-sm.unban:hover {
            background: #1e7a47;
            color: white;
        }

        .btn-sm.logout {
            background: rgba(220, 60, 80, 0.15);
            color: #faaab5;
            border: 1px solid #b44b5a;
        }

        .btn-sm.logout:hover {
            background: #832f3f;
            color: white;
        }

        .btn-sm.refresh {
            background: rgba(70, 130, 255, 0.15);
            color: #7f97d0;
            border: 1px solid rgba(70, 130, 255, 0.2);
        }

        .btn-sm.refresh:hover {
            background: #2b3d6e;
            color: white;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a264b;
            border: 1px solid #3f6eff;
            padding: 0.8rem 1.6rem;
            border-radius: 60px;
            color: #d6e2ff;
            font-size: 0.9rem;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.25s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .toast i {
            color: #5f84ff;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #5d73a8;
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
            opacity: 0.4;
        }

        .site-link {
            color: #5f84ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: 0.15s;
        }

        .site-link:hover {
            color: #7a9cff;
            text-decoration: underline;
        }

        @media (max-width: 680px) {
            .admin-container { padding: 1.5rem; }
            .stats-grid { grid-template-columns: 1fr; }
            .table-controls input { min-width: 100%; }
            .admin-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <!-- Header -->
    <div class="admin-header">
        <div class="brand">
            <div class="brand-logo">
                <img src="https://www.image2url.com/r2/default/images/1787220047845-28f1c7c8-6565-4952-a936-2640fa9b7408.png" alt="TempNexus" />
            </div>
            <h1><i class="fas fa-crown"></i> Admin Control</h1>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <a href="https://kco-maile.vercel.app/" target="_blank" class="site-link">
                <i class="fas fa-external-link-alt"></i> kco-maile.vercel.app
            </a>
            <span class="status-badge" id="connectionStatus">
                <i class="fas fa-circle" style="font-size:0.5rem;"></i> Connected
            </span>
        </div>
    </div>

    <!-- Login Section -->
    <div id="loginSection" class="login-section">
        <h2><i class="fas fa-shield-alt"></i> Admin Access</h2>
        <div class="login-form">
            <input type="text" id="adminUser" placeholder="Username" value="admin">
            <input type="password" id="adminPass" placeholder="Password" value="admin123">
            <div id="loginError" class="login-error">
                <i class="fas fa-exclamation-triangle"></i> Invalid credentials
            </div>
            <button class="btn btn-primary" id="loginBtn">
                <i class="fas fa-lock-open"></i> Enter Admin Panel
            </button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label"><i class="fas fa-users"></i> Total Users</div>
                <div class="value" id="totalUsers">0</div>
                <div class="change" id="userChange">—</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-envelope"></i> Total Emails</div>
                <div class="value" id="totalMails">0</div>
                <div class="change" id="mailChange">—</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-eye"></i> Active Now</div>
                <div class="value" id="activeNow">0</div>
                <div class="change" id="activeChange">—</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-ban"></i> Banned Users</div>
                <div class="value" id="bannedUsers">0</div>
                <div class="change" id="bannedChange">—</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-clock"></i> Total Visitors</div>
                <div class="value" id="totalVisitors">0</div>
                <div class="change" id="visitorChange">—</div>
            </div>
            <div class="stat-card">
                <div class="label"><i class="fas fa-database"></i> Data Size</div>
                <div class="value" id="dataSize">0 KB</div>
                <div class="change" id="sizeChange">—</div>
            </div>
        </div>

        <!-- User Table -->
        <div class="table-container">
            <div class="table-header">
                <h3><i class="fas fa-list-ul"></i> User Management</h3>
                <div class="table-controls">
                    <input type="text" id="searchInput" placeholder="Search by IP or username...">
                    <button class="btn-sm refresh" id="refreshBtn"><i class="fas fa-sync-alt"></i> Refresh</button>
                    <button class="btn-sm logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>IP Address</th>
                            <th>Username</th>
                            <th>Emails</th>
                            <th>Status</th>
                            <th>Last Active</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" style="text-align:center;color:#5d73a8;padding:2rem;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">Done</span></div>

<script>
    (function() {
        "use strict";

        // ---------- STATE ----------
        let users = [];
        let bannedIPs = [];
        let totalMailsCreated = 0;
        let visitorLog = [];
        let previousStats = { users: 0, mails: 0, active: 0, banned: 0, visitors: 0 };
        let refreshInterval = null;
        let isLoggedIn = false;

        // DOM refs
        const loginSection = document.getElementById('loginSection');
        const dashboard = document.getElementById('dashboard');
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const adminUser = document.getElementById('adminUser');
        const adminPass = document.getElementById('adminPass');
        const loginError = document.getElementById('loginError');
        const userTableBody = document.getElementById('userTableBody');
        const searchInput = document.getElementById('searchInput');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const connectionStatus = document.getElementById('connectionStatus');

        // Stat elements
        const totalUsersEl = document.getElementById('totalUsers');
        const totalMailsEl = document.getElementById('totalMails');
        const activeNowEl = document.getElementById('activeNow');
        const bannedUsersEl = document.getElementById('bannedUsers');
        const totalVisitorsEl = document.getElementById('totalVisitors');
        const dataSizeEl = document.getElementById('dataSize');
        const userChange = document.getElementById('userChange');
        const mailChange = document.getElementById('mailChange');
        const activeChange = document.getElementById('activeChange');
        const bannedChange = document.getElementById('bannedChange');
        const visitorChange = document.getElementById('visitorChange');
        const sizeChange = document.getElementById('sizeChange');

        // ---- Toast ----
        function showToast(msg, icon = 'fa-check-circle') {
            toastMessage.textContent = msg;
            toast.querySelector('i').className = 'fas ' + icon;
            toast.classList.add('show');
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ---- Load data from localStorage (cross-site) ----
        function loadData() {
            try {
                // Since this is a separate admin panel, we need to access the same localStorage
                // In production, this would be a backend API. For now, we use localStorage.
                // Note: This only works if the admin panel is on the same domain or subdomain.
                // For cross-domain, you'd need an API.
                users = JSON.parse(localStorage.getItem('tempnexus_users')) || [];
                bannedIPs = JSON.parse(localStorage.getItem('tempnexus_banned')) || [];
                totalMailsCreated = parseInt(localStorage.getItem('tempnexus_totalMails')) || 0;
                visitorLog = JSON.parse(localStorage.getItem('tempnexus_visitors')) || [];

                // Update connection status
                connectionStatus.innerHTML = '<i class="fas fa-circle" style="font-size:0.5rem;color:#3fc77a;"></i> Connected';
                connectionStatus.style.borderColor = 'rgba(63,199,122,0.2)';

                return true;
            } catch (e) {
                console.error('Error loading data:', e);
                connectionStatus.innerHTML = '<i class="fas fa-circle" style="font-size:0.5rem;color:#faaab5;"></i> Disconnected';
                connectionStatus.style.borderColor = 'rgba(220,60,80,0.2)';
                return false;
            }
        }

        // ---- Save data ----
        function saveData() {
            try {
                localStorage.setItem('tempnexus_users', JSON.stringify(users));
                localStorage.setItem('tempnexus_banned', JSON.stringify(bannedIPs));
                localStorage.setItem('tempnexus_totalMails', String(totalMailsCreated));
                localStorage.setItem('tempnexus_visitors', JSON.stringify(visitorLog));
            } catch (e) {
                console.error('Error saving data:', e);
            }
        }

        // ---- Admin functions ----
        function renderUserTable(filter = '') {
            if (!userTableBody) return;

            const filteredUsers = users.filter(u => 
                u.ip.includes(filter) || 
                (u.username && u.username.toLowerCase().includes(filter.toLowerCase()))
            );

            if (filteredUsers.length === 0) {
                userTableBody.innerHTML = `
                    <tr><td colspan="6" style="text-align:center;color:#5d73a8;padding:2rem;">
                        <i class="fas fa-users" style="font-size:1.5rem;display:block;margin-bottom:0.5rem;opacity:0.4;"></i>
                        No users found
                    </td></tr>
                `;
                return;
            }

            let html = '';
            filteredUsers.forEach(user => {
                const isBanned = bannedIPs.includes(user.ip);
                const status = isBanned ? 'banned' : 'active';
                const lastActive = user.lastActive ? new Date(user.lastActive).toLocaleString() : 'Never';
                
                html += `
                    <tr>
                        <td><code style="background:rgba(0,0,0,0.3);padding:0.2rem 0.6rem;border-radius:12px;font-size:0.85rem;">${user.ip}</code></td>
                        <td>${user.username || '—'}</td>
                        <td>${user.mails || 0}</td>
                        <td><span class="status-badge ${status}">${status}</span></td>
                        <td style="font-size:0.8rem;color:#6a80b3;">${lastActive}</td>
                        <td>
                            ${isBanned 
                                ? `<button class="btn-sm unban" data-ip="${user.ip}"><i class="fas fa-check"></i> Unban</button>`
                                : `<button class="btn-sm ban" data-ip="${user.ip}"><i class="fas fa-ban"></i> Ban</button>`
                            }
                        </td>
                    </tr>
                `;
            });
            userTableBody.innerHTML = html;

            // Attach events
            document.querySelectorAll('.btn-sm.ban').forEach(btn => {
                btn.addEventListener('click', function() {
                    const ip = this.dataset.ip;
                    banUser(ip);
                });
            });
            document.querySelectorAll('.btn-sm.unban').forEach(btn => {
                btn.addEventListener('click', function() {
                    const ip = this.dataset.ip;
                    unbanUser(ip);
                });
            });
        }

        function banUser(ip) {
            if (!bannedIPs.includes(ip)) {
                bannedIPs.push(ip);
                const user = users.find(u => u.ip === ip);
                if (user) user.status = 'banned';
                saveData();
                renderUserTable(searchInput.value);
                updateStats();
                showToast(`Banned IP: ${ip}`, 'fa-ban');
            }
        }

        function unbanUser(ip) {
            bannedIPs = bannedIPs.filter(b => b !== ip);
            const user = users.find(u => u.ip === ip);
            if (user) user.status = 'active';
            saveData();
            renderUserTable(searchInput.value);
            updateStats();
            showToast(`Unbanned IP: ${ip}`, 'fa-check');
        }

        function updateStats() {
            const activeUsers = users.filter(u => u.status === 'active').length;
            const bannedCount = bannedIPs.length;
            const now = new Date();
            const activeNow = users.filter(u => {
                if (!u.lastActive) return false;
                const last = new Date(u.lastActive);
                return (now - last) < 300000 && u.status === 'active';
            }).length;

            // Calculate changes
            const userChangeVal = users.length - previousStats.users;
            const mailChangeVal = totalMailsCreated - previousStats.mails;
            const activeChangeVal = activeNow - previousStats.active;
            const bannedChangeVal = bannedCount - previousStats.banned;
            const visitorChangeVal = visitorLog.length - previousStats.visitors;

            // Update values
            totalUsersEl.textContent = users.length;
            totalMailsEl.textContent = totalMailsCreated;
            activeNowEl.textContent = activeNow;
            bannedUsersEl.textContent = bannedCount;
            totalVisitorsEl.textContent = visitorLog.length;

            // Calculate data size
            const data = JSON.stringify({ users, bannedIPs, totalMailsCreated, visitorLog });
            const sizeKB = (data.length / 1024).toFixed(1);
            dataSizeEl.textContent = sizeKB + ' KB';

            // Update changes
            userChange.textContent = userChangeVal > 0 ? `+${userChangeVal} new` : userChangeVal < 0 ? `${userChangeVal} lost` : 'No change';
            userChange.className = 'change ' + (userChangeVal > 0 ? 'positive' : userChangeVal < 0 ? 'negative' : '');
            
            mailChange.textContent = mailChangeVal > 0 ? `+${mailChangeVal} new` : mailChangeVal === 0 ? 'No change' : `${mailChangeVal} lost`;
            mailChange.className = 'change ' + (mailChangeVal > 0 ? 'positive' : mailChangeVal < 0 ? 'negative' : '');
            
            activeChange.textContent = activeChangeVal > 0 ? `+${activeChangeVal} now` : activeChangeVal === 0 ? 'Steady' : `${activeChangeVal} less`;
            activeChange.className = 'change ' + (activeChangeVal > 0 ? 'positive' : activeChangeVal < 0 ? 'negative' : '');
            
            bannedChange.textContent = bannedChangeVal > 0 ? `+${bannedChangeVal} banned` : bannedChangeVal === 0 ? 'No change' : `${bannedChangeVal} unbanned`;
            bannedChange.className = 'change ' + (bannedChangeVal > 0 ? 'negative' : bannedChangeVal < 0 ? 'positive' : '');
            
            visitorChange.textContent = visitorChangeVal > 0 ? `+${visitorChangeVal} new` : visitorChangeVal === 0 ? 'No change' : `${visitorChangeVal} lost`;
            visitorChange.className = 'change ' + (visitorChangeVal > 0 ? 'positive' : visitorChangeVal < 0 ? 'negative' : '');

            // Store for next comparison
            previousStats = {
                users: users.length,
                mails: totalMailsCreated,
                active: activeNow,
                banned: bannedCount,
                visitors: visitorLog.length
            };
        }

        // ---- Admin Login ----
        function adminLogin() {
            const username = adminUser.value.trim();
            const password = adminPass.value.trim();

            if (username === 'admin' && password === 'admin123') {
                loginError.style.display = 'none';
                loginSection.style.display = 'none';
                dashboard.style.display = 'block';
                isLoggedIn = true;
                
                if (loadData()) {
                    renderUserTable();
                    updateStats();
                    showToast('Welcome Admin!', 'fa-shield-alt');
                    
                    // Start auto-refresh
                    if (refreshInterval) clearInterval(refreshInterval);
                    refreshInterval = setInterval(() => {
                        if (isLoggedIn) {
                            loadData();
                            renderUserTable(searchInput.value);
                            updateStats();
                        }
                    }, 15000);
                } else {
                    showToast('Error loading data. Please check connection.', 'fa-exclamation-triangle');
                }
            } else {
                loginError.style.display = 'block';
                setTimeout(() => { loginError.style.display = 'none'; }, 3000);
            }
        }

        function adminLogout() {
            isLoggedIn = false;
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            loginSection.style.display = 'flex';
            dashboard.style.display = 'none';
            showToast('Logged out', 'fa-sign-out-alt');
        }

        // ---- Init ----
        function init() {
            // Check if already logged in via session
            if (sessionStorage.getItem('tempnexus_admin_session') === 'true') {
                adminLogin();
            }

            // Event listeners
            loginBtn.addEventListener('click', adminLogin);
            logoutBtn.addEventListener('click', adminLogout);
            refreshBtn.addEventListener('click', function() {
                if (isLoggedIn) {
                    loadData();
                    renderUserTable(searchInput.value);
                    updateStats();
                    showToast('Refreshed', 'fa-sync-alt');
                }
            });

            searchInput.addEventListener('input', function() {
                if (isLoggedIn) {
                    renderUserTable(this.value);
                }
            });

            adminUser.addEventListener('keydown', (e) => { if (e.key === 'Enter') adminLogin(); });
            adminPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') adminLogin(); });

            // Load initial data if logged in
            if (sessionStorage.getItem('tempnexus_admin_session') === 'true') {
                loadData();
                renderUserTable();
                updateStats();
            }

            console.log('TempNexus Admin Panel initialized');
            console.log('Site: https://kco-maile.vercel.app/');
        }

        // Override login to save session
        const originalLogin = adminLogin;
        adminLogin = function() {
            originalLogin.call(this);
            sessionStorage.setItem('tempnexus_admin_session', 'true');
        };

        const originalLogout = adminLogout;
        adminLogout = function() {
            originalLogout.call(this);
            sessionStorage.removeItem('tempnexus_admin_session');
        };

        init();
    })();
</script>

</body>
</html>
