<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KCO Mail Generator | InstaAddr Temporary Mail Service</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #10b981;
      --danger: #ef4444;
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-muted: #64748b;
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg-gradient); color: var(--text); min-height: 100vh; padding: 16px; transition: background 0.3s; }
    
    .container { max-width: 1200px; margin: 0 auto; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px; background: var(--card-bg); border: 1px solid var(--border);
      backdrop-filter: blur(16px); border-radius: 16px; margin-bottom: 20px;
    }
    
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 8px; }
    
    .glass {
      background: var(--card-bg); backdrop-filter: blur(16px);
      border: 1px solid var(--border); border-radius: 16px;
      box-shadow: var(--glass-shadow); padding: 20px; margin-bottom: 20px;
    }

    .toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; }
    @media (max-width: 768px) { .toolbar { grid-template-columns: 1fr; } }

    .input-group { display: flex; gap: 8px; flex-wrap: wrap; }
    input, select {
      padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15); color: var(--text); font-size: 0.95rem; outline: none;
    }
    input[type="text"] { flex: 1; min-width: 180px; }

    button {
      padding: 12px 20px; border-radius: 10px; border: none; background: var(--primary);
      color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
    }
    button:hover { background: var(--primary-hover); transform: translateY(-1px); }
    button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    button.danger { background: var(--danger); }

    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted); flex-wrap: wrap; gap: 10px; }
    
    .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    @media (max-width: 850px) { .main-layout { grid-template-columns: 1fr; } }

    .inbox-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .email-list { list-style: none; max-height: 520px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .email-card {
      padding: 14px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; position: relative;
    }
    .email-card:hover { background: rgba(255,255,255,0.05); }
    .email-card.unread { border-left: 4px solid var(--accent); font-weight: 600; }
    .email-card .sender { font-size: 0.9rem; margin-bottom: 4px; }
    .email-card .subject { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .email-viewer { min-height: 400px; display: flex; flex-direction: column; }
    .email-viewer-header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 16px; }
    .email-body { flex: 1; line-height: 1.6; word-break: break-word; }
    
    .badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .badge.ip { background: rgba(16, 185, 129, 0.2); color: var(--accent); border: 1px solid var(--accent); }

    .attachments { margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border); }
    .attachment-item { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(0,0,0,0.2); border-radius: 8px; text-decoration: none; color: var(--text); font-size: 0.85rem; margin-right: 8px; }

    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--primary);
      color: white; padding: 12px 20px; border-radius: 10px; font-weight: 500;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3); opacity: 0; transform: translateY(10px);
      transition: all 0.3s; z-index: 1000; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">⚡ KCO Mail Generator <span style="font-size: 0.7rem; color: var(--accent);">20+ DOMAINS</span></div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <span class="badge ip" id="user-fp">IP Sync Active</span>
      <button class="secondary" onclick="toggleTheme()">🌓</button>
    </div>
  </header>

  <div class="glass">
    <div class="toolbar">
      <div class="input-group">
        <input type="text" id="custom-prefix" placeholder="Custom prefix..." style="max-width: 160px;">
        <select id="domain-select"><option value="">Loading 20+ domains...</option></select>
        <button onclick="createNewAddress()">Create Mail</button>
      </div>
      <div class="input-group">
        <input type="text" id="active-email" readonly placeholder="Your temp email address...">
        <button onclick="copyEmail()">Copy</button>
        <button class="secondary" onclick="manualRefresh()">🔄 Sync</button>
      </div>
    </div>

    <div class="status-bar">
      <div>
        <span>Active Mailbox: </span>
        <strong id="display-address-lbl">None</strong>
      </div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <span style="font-size: 0.8rem; color: var(--accent);">⏳ 30-Day Auto Retention Active</span>
        <button class="danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="clearCurrentInbox()">Delete Local Mail</button>
      </div>
    </div>
  </div>

  <div class="main-layout">
    <div class="glass">
      <div class="inbox-header">
        <h3>Inbox (<span id="unread-count">0</span>)</h3>
        <span class="badge" id="sync-status">Connected</span>
      </div>
      <input type="text" id="search-input" placeholder="Search inbox..." oninput="applyFilter()" style="width: 100%; margin-bottom: 12px;">
      <ul class="email-list" id="email-list">
        <li class="email-card">Waiting for messages...</li>
      </ul>
    </div>

    <div class="glass email-viewer" id="email-viewer">
      <div style="text-align: center; color: var(--text-muted); margin: auto;">
        📩 Select an email from the inbox list to read full content.
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast">Notification</div>

<script>
  let activeEmail = localStorage.getItem('kco_email') || '';
  let cachedMessages = JSON.parse(localStorage.getItem('kco_messages') || '[]');
  let syncTimer = null;

  const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;

  function playAlertSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 587.33;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      osc.start();
      osc.stop(ctx.currentTime + 0.25);
    } catch(e){}
  }

  function showToast(text) {
    const toast = document.getElementById('toast');
    toast.innerText = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function toggleTheme() {
    const isDark = document.body.getAttribute('data-theme') !== 'light';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }

  async function loadDomains() {
    try {
      const res = await fetch('/api/mailbox?action=getDomains');
      const data = await res.json();
      const select = document.getElementById('domain-select');
      select.innerHTML = data.domains.map(d => `<option value="${d}">@${d}</option>`).join('');
      document.getElementById('user-fp').innerText = `IP Sync: ${data.fingerprint}`;
    } catch(e) {
      showToast('Failed to load domains');
    }
  }

  async function createNewAddress() {
    const prefix = document.getElementById('custom-prefix').value.trim();
    const domain = document.getElementById('domain-select').value;

    try {
      let url = `/api/mailbox?action=generate`;
      if (prefix) url += `&customName=${encodeURIComponent(prefix)}`;
      if (domain) url += `&domain=${encodeURIComponent(domain)}`;

      const res = await fetch(url);
      const data = await res.json();

      activeEmail = data.email;
      localStorage.setItem('kco_email', activeEmail);

      updateAddressDisplay();
      startPolling();
      showToast('New temporary email active!');
    } catch(e) {
      showToast('Failed to create new address');
    }
  }

  function updateAddressDisplay() {
    document.getElementById('active-email').value = activeEmail;
    document.getElementById('display-address-lbl').innerText = activeEmail || 'None';
  }

  function copyEmail() {
    const val = document.getElementById('active-email').value;
    if (!val) return;
    navigator.clipboard.writeText(val);
    showToast('Copied to clipboard!');
  }

  async function fetchMessages() {
    if (!activeEmail) return;
    document.getElementById('sync-status').innerText = 'Syncing...';
    try {
      const res = await fetch(`/api/mailbox?action=getMessages&email=${encodeURIComponent(activeEmail)}`);
      const data = await res.json();

      if (data.messages) {
        let hasNew = false;
        data.messages.forEach(incoming => {
          if (!cachedMessages.find(m => m.id === incoming.id)) {
            cachedMessages.unshift({ ...incoming, unread: true, timestamp: Date.now() });
            hasNew = true;
          }
        });

        if (hasNew) {
          playAlertSound();
          saveAndRenderMessages();
          showToast('New email received!');
        }
      }
      document.getElementById('sync-status').innerText = 'Connected';
    } catch(e) {
      document.getElementById('sync-status').innerText = 'Sync Error';
    }
  }

  async function openMessage(id) {
    const msgObj = cachedMessages.find(m => m.id === id);
    if (msgObj) msgObj.unread = false;
    saveAndRenderMessages();

    const viewer = document.getElementById('email-viewer');
    viewer.innerHTML = '<div style="margin: auto;">Loading email content...</div>';

    try {
      const res = await fetch(`/api/mailbox?action=readMessage&email=${encodeURIComponent(activeEmail)}&id=${id}`);
      const data = await res.json();
      const msg = data.message;

      let attachmentsHtml = '';
      if (msg.attachments && msg.attachments.length > 0) {
        attachmentsHtml = `
          <div class="attachments">
            <strong>Attachments (${msg.attachments.length}):</strong><br><br>
            ${msg.attachments.map(a => `
              <a class="attachment-item" href="/api/mailbox?action=downloadAttachment&email=${encodeURIComponent(activeEmail)}&id=${id}&filename=${encodeURIComponent(a.filename)}" target="_blank">
                📎 ${a.filename} (${Math.round(a.size / 1024)} KB)
              </a>
            `).join('')}
          </div>
        `;
      }

      viewer.innerHTML = `
        <div class="email-viewer-header">
          <h2>${msg.subject || 'No Subject'}</h2>
          <p style="margin-top: 8px; color: var(--text-muted);"><strong>From:</strong> ${msg.from}</p>
          <p style="color: var(--text-muted);"><strong>Date:</strong> ${msg.date}</p>
        </div>
        <div class="email-body">${msg.htmlBody || msg.body}</div>
        ${attachmentsHtml}
      `;
    } catch(e) {
      viewer.innerHTML = '<div style="color: var(--danger); margin: auto;">Failed to render email.</div>';
    }
  }

  // Enforces 30-day message auto-purge
  function purgeExpiredMessages() {
    const now = Date.now();
    cachedMessages = cachedMessages.filter(m => (now - (m.timestamp || now)) < THIRTY_DAYS_MS);
  }

  function saveAndRenderMessages() {
    purgeExpiredMessages();
    localStorage.setItem('kco_messages', JSON.stringify(cachedMessages));
    applyFilter();
  }

  function applyFilter() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const filtered = cachedMessages.filter(m => 
      m.from.toLowerCase().includes(query) || 
      m.subject.toLowerCase().includes(query)
    );
    renderList(filtered);
  }

  function renderList(list) {
    const ul = document.getElementById('email-list');
    const unread = cachedMessages.filter(m => m.unread).length;
    document.getElementById('unread-count').innerText = unread;

    if (list.length === 0) {
      ul.innerHTML = '<li class="email-card">No messages found.</li>';
      return;
    }

    ul.innerHTML = list.map(m => `
      <li class="email-card ${m.unread ? 'unread' : ''}" onclick="openMessage(${m.id})">
        <div class="sender">${m.from}</div>
        <div class="subject">${m.subject || 'No Subject'}</div>
      </li>
    `).join('');
  }

  function clearCurrentInbox() {
    cachedMessages = [];
    saveAndRenderMessages();
    document.getElementById('email-viewer').innerHTML = '<div style="text-align: center; color: var(--text-muted); margin: auto;">Inbox cleared.</div>';
    showToast('Local inbox cleared');
  }

  function manualRefresh() {
    fetchMessages();
    showToast('Syncing inbox...');
  }

  function startPolling() {
    if (syncTimer) clearInterval(syncTimer);
    fetchMessages();
    syncTimer = setInterval(fetchMessages, 4000);
  }

  window.onload = async () => {
    await loadDomains();

    if (activeEmail) {
      updateAddressDisplay();
      startPolling();
    } else {
      await createNewAddress();
    }

    saveAndRenderMessages();
  };
</script>
</body>
</html>
